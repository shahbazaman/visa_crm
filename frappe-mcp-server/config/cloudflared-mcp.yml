# Cloudflare Named Tunnel Configuration for Frappe CRM MCP Server
# Production Ingress Routing to Local MCP Streamable HTTP Service
# Parameterized: Replace <TUNNEL_ID>, <CREDENTIALS_FILE>, and <YOUR_DOMAIN>

tunnel: <TUNNEL_ID>
credentials-file: <CREDENTIALS_FILE> # e.g. /home/shahbaz/.cloudflared/<TUNNEL_ID>.json

ingress:
  # Route traffic for your custom MCP subdomain to the local MCP server
  - hostname: crm-mcp.<YOUR_DOMAIN>
    service: http://127.0.0.1:8000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Catch-all fallback rule (returns HTTP 404 for unmapped hostnames)
  - service: http_status:404
