services:
  - type: web
    name: visa-crm-mcp
    runtime: docker
    plan: starter
    region: singapore
    rootDir: frappe-mcp-server
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FRAPPE_BASE_URL
        value: https://middleeast.frappe.cloud
      - key: FRAPPE_API_KEY
        sync: false
      - key: FRAPPE_API_SECRET
        sync: false
      - key: GEMINI_CLIENT_ID
        value: gemini-spark-client
      - key: GEMINI_CLIENT_SECRET
        sync: false
      - key: OAUTH_JWT_SECRET
        sync: false
      - key: MCP_HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
